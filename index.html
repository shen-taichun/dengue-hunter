<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登革熱獵人 - 孳生源清除大作戰</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Fredoka', 'Noto Sans TC', sans-serif; user-select: none; -webkit-user-select: none; }
        @keyframes splat { 0% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        .animate-splat { animation: splat 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes floatText { 0% { transform: translateY(0px); opacity: 1; } 100% { transform: translateY(-40px); opacity: 0; } }
        .animate-floatText { animation: floatText 1.2s ease-out forwards; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-gradient-to-br from-emerald-50 via-teal-100 to-cyan-100 min-height-screen text-slate-800 overflow-x-hidden antialiased">

    <!-- TOP HEADER BAR -->
    <header class="w-full py-4 px-6 flex justify-between items-center bg-white/60 backdrop-blur-md border-b border-teal-100/50 sticky top-0 z-40 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-teal-500 rounded-full flex items-center justify-center text-white text-xl shadow-md shadow-teal-200">
                <i class="fa-solid fa-mosquito"></i>
            </div>
            <div>
                <h1 class="text-xl font-black text-teal-800 tracking-wide">登革熱獵人</h1>
                <p class="text-xs text-teal-600 font-bold">孳生源清除大作戰</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <div id="roster-status" class="hidden text-xs bg-emerald-100 text-emerald-700 px-3 py-1.5 rounded-full font-bold flex items-center gap-1">
                <i class="fa-solid fa-cloud-check animate-pulse"></i> <span>雲端名冊已載入</span>
            </div>
            <button onclick="toggleSettings()" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500 hover:text-slate-800 transition duration-200">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 min-h-[calc(100vh-80px)] flex flex-col justify-center items-center">
        <!-- WELCOME SCREEN -->
        <section id="screen-welcome" class="w-full max-w-lg glass rounded-3xl border border-white/60 p-8 shadow-xl text-center space-y-6">
            <div class="space-y-2">
                <div class="inline-block px-4 py-1.5 bg-rose-100 text-rose-700 text-sm font-extrabold rounded-full mb-2">⚡ 跨裝置即時競技模式</div>
                <h2 class="text-3xl font-extrabold text-slate-800">打倒病媒蚊！</h2>
                <p class="text-slate-500">在限定時間內，找出所有潛藏的病媒蚊孳生容器。</p>
            </div>
            <div id="connection-warning" class="hidden w-full bg-amber-50 border border-amber-200 p-3.5 rounded-2xl text-left text-xs text-amber-800 font-bold flex items-start gap-2.5">
                <i class="fa-solid fa-circle-exclamation text-amber-500 text-lg mt-0.5"></i>
                <div><span class="block text-slate-800 font-black mb-0.5">⚠️ 雲端名冊載入錯誤</span><span>系統切換至「本機手動輸入模式」。</span></div>
            </div>
            <div class="space-y-4 text-left">
                <div>
                    <label class="block text-sm font-extrabold text-slate-600 mb-2"><i class="fa-solid fa-school text-teal-500 mr-1.5"></i> 選擇你的班級</label>
                    <select id="input-class" onchange="handleClassChange()" class="w-full px-4 py-3.5 bg-white border border-teal-200 rounded-2xl focus:ring-4 focus:ring-teal-100 outline-none transition font-bold text-slate-700 appearance-none">
                        <option value="701">701 班</option><option value="702">702 班</option><option value="703">703 班</option><option value="教師測試">教師/訪客 測試</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-extrabold text-slate-600 mb-2"><i class="fa-solid fa-user text-teal-500 mr-1.5"></i> 選擇或輸入你的姓名</label>
                    <div id="student-name-input-container">
                        <input type="text" id="input-name" placeholder="例如：林小明" class="w-full px-4 py-3.5 bg-white border border-teal-200 rounded-2xl focus:ring-4 focus:ring-teal-100 outline-none transition font-bold text-slate-700">
                    </div>
                </div>
            </div>
            <button onclick="startGame()" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-extrabold text-lg rounded-2xl shadow-lg transition active:scale-95">進入遊戲</button>
        </section>

        <!-- GAME SCREEN -->
        <section id="screen-game" class="w-full hidden flex-col items-center gap-4">
            <div class="w-full max-w-4xl flex flex-wrap justify-between items-center bg-white/80 backdrop-blur-md border border-teal-100 rounded-2xl p-4 gap-4 shadow-sm">
                <div>
                    <div class="px-3.5 py-1.5 bg-teal-100 text-teal-800 text-sm font-black rounded-lg">關卡 <span id="hud-level-num">1</span></div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-right">
                        <div class="text-xs font-bold text-slate-400">已清除孳生源 <span id="timer-status-indicator" class="text-[10px] bg-amber-500 text-white px-1 py-0.5 rounded hidden">已暫停</span></div>
                        <div class="text-xl font-black text-rose-600 font-mono" id="hud-timer">00:00.00</div>
                    </div>
                </div>
            </div>
            <div class="w-full max-w-4xl relative bg-slate-900 rounded-3xl overflow-hidden shadow-2xl aspect-[1.6] border-4 border-white" id="game-board-container">
                <img id="game-bg-image" src="" class="absolute inset-0 w-full h-full object-cover z-10 opacity-0 transition-opacity duration-300">
                <div id="game-click-layer" class="absolute inset-0 z-20 cursor-crosshair" onclick="handleBoardClick(event)"></div>
                <div id="found-markers-layer" class="absolute inset-0 z-30 pointer-events-none"></div>
                <div id="feedback-layer" class="absolute inset-0 z-40 pointer-events-none overflow-hidden"></div>
            </div>
        </section>

        <!-- SCORE SCREEN -->
        <section id="screen-scoreboard" class="w-full max-w-2xl hidden glass rounded-3xl p-8 shadow-xl text-center space-y-6">
            <h2 class="text-3xl font-extrabold text-slate-800"><span id="score-class-title">---</span> 班級排行榜</h2>
            <div id="leaderboard-body" class="bg-white p-4 rounded-2xl border border-slate-100"></div>
            <button onclick="resetToWelcome()" class="w-full py-4 bg-slate-100 hover:bg-slate-200 font-extrabold rounded-2xl">返回首頁</button>
        </section>
    </main>

    <!-- SETTINGS MODAL -->
    <div id="modal-settings" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex justify-center items-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-3xl p-6 shadow-2xl overflow-y-auto max-h-[90vh]">
            <h3 class="text-xl font-black mb-4">教師後台</h3>
            <button onclick="resetToDefaultConfigs()" class="bg-rose-100 text-rose-600 px-4 py-2 rounded-xl font-bold mb-4">清除記憶並還原最新預設</button>
            <div id="editor-map-container" class="relative bg-slate-100 rounded-2xl aspect-[1.6] border-2 border-dashed border-slate-300 overflow-hidden cursor-crosshair" onclick="handleEditorMapClick(event)">
                <img id="editor-bg-preview" class="absolute inset-0 w-full h-full object-cover">
                <div id="editor-markers-layer" class="absolute inset-0 z-10"></div>
            </div>
            <div class="mt-4"><button onclick="saveAllConfigs()" class="w-full py-4 bg-teal-500 text-white font-bold rounded-2xl">保存設定</button></div>
        </div>
    </div>

    <!-- O/X QUIZ MODAL -->
    <div id="custom-alert" class="fixed inset-0 z-50 hidden flex justify-center items-center p-4 bg-slate-950/40 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl text-center space-y-4 border border-slate-100 animate-splat">
            <div id="alert-icon" class="w-16 h-16 rounded-full flex items-center justify-center text-3xl mx-auto shadow-sm bg-indigo-100 text-indigo-500"><i class="fa-solid fa-clipboard-question"></i></div>
            <h3 class="text-xl font-extrabold text-slate-800" id="alert-title">標題</h3>
            <p class="text-sm font-bold text-slate-600 p-4 rounded-xl bg-slate-50" id="alert-text">內文</p>
            <div id="quiz-container" class="hidden flex-col gap-3">
                <div class="text-sm font-black text-rose-600">🎯 防疫隨堂考 (答對減3秒，答錯加罰10秒)：</div>
                <div class="flex gap-3">
                    <button onclick="handleQuizAnswer(true)" class="flex-1 py-3 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 font-extrabold rounded-xl border border-emerald-300 transition">對 (O)</button>
                    <button onclick="handleQuizAnswer(false)" class="flex-1 py-3 bg-rose-100 hover:bg-rose-200 text-rose-700 font-extrabold rounded-xl border border-rose-300 transition">錯 (X)</button>
                </div>
            </div>
            <button onclick="closeAlert()" id="alert-btn" class="w-full py-3 bg-teal-500 hover:bg-teal-600 text-white font-extrabold text-sm rounded-xl transition">確定</button>
        </div>
    </div>

    <script>
        var DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbyr6TqsX8Uv7F7zsAi5Wi777ThTki_uLAskCpGQzEsfvCEaC1fE5vkstMllDgbQo5JjHA/exec";
        var TEACHER_PASSWORD = "6888";
        
        var gameData = { levels: [
            { levelNum: 1, title: "第一關：室內廚房危機", bgImg: "indoor.png", backupBgImg: "https://images.unsplash.com/photo-1556911220-e15b29be8c8f?auto=format&fit=crop&q=80&w=1200", hotspots: [
                {id:1,x:3.5,y:31,r:9,name:"窗台花盆底盤",desc:"花盆底盤積水是室內最常見的斑蚊孳生地點，需定期倒水清洗。"},
                {id:2,x:15.5,y:52,r:8.5,name:"廚房水槽碗碟積水",desc:"水槽中堆疊的未洗碗盤容易積水，即使一小口水也能讓蚊子產卵。"},
                {id:3,x:72,y:36.5,r:6.5,name:"飲水機水盤",desc:"飲水機接水盤、冰箱除霜水盤都是極易被遺忘的室內積水點。"},
                {id:4,x:86.8,y:49.5,r:8,name:"浴室放置過久的水桶",desc:"用完的水桶應清洗後，倒置，避免積水"},
                {id:5,x:25.6,y:91.4,r:10,name:"[衛教]潮濕的地毯",desc:"地毯潮濕主要會影響環境衛生"},
                {id:6,x:93.4,y:25,r:8,name:"積水的花瓶、容器",desc:"閒置不用的容器應清除積水後倒置並保持乾燥"},
                {id:7,x:55.7,y:37.9,r:8,name:"[衛教]有加蓋的冷水壺",desc:"盛裝水的容器有加蓋比較不會孳生蚊蟲"},
                {id:8,x:16.5,y:31,r:8,name:"[衛教]盆栽",desc:"這個盆栽沒有會積水的接水盤喔！"},
                {id:9,x:79.5,y:65.2,r:8,name:"[衛教]盛裝飲品的水杯",desc:"沒喝完的飲料在還沒孳生蚊蠅之前，就已經先發霉啦！記得隨手清洗食具，避免食物中毒。"},
                {id:10,x:93.1,y:79.7,r:8,name:"[衛教]食器",desc:"沒積水的食具，沒收放整齊有礙觀瞻。"},
                {id:11,x:21.2,y:48.3,r:8,name:"[衛教]廚房水槽碗碟積水",desc:"跟左邊那一疊一樣會有孳生蚊子的風險"},
                {id:12,x:7.8,y:62.6,r:8,name:"[衛教]未食用的點心",desc:"只要是食物都要留意存放的地點跟溫度，盡早食用。"}
            ]},
            { levelNum: 2, title: "第二關：室外庭院清源", bgImg: "outdoor.png", backupBgImg: "https://images.unsplash.com/photo-1590001155093-a3c66ab0c3ff?auto=format&fit=crop&q=80&w=1200", hotspots: [
                {id:3,x:47.5,y:81,r:12,name:"露天雨後地面積水",desc:"不平整的水泥地 or 石板路雨後易積水，應及時填平或掃乾淨。"},
                {id:7,x:38.7,y:50,r:10,name:"露天鐵桶",desc:"閒置的大型容器下雨時迅速積水，必須倒置或蓋上細紗網。"},
                {id:8,x:16.1,y:39.3,r:8,name:"防塵塑膠布皺褶",desc:"覆蓋雜物的塑膠帆布凹槽極易在雨後產生水袋積水，須拉平拉直。"},
                {id:9,x:74.1,y:31.3,r:8,name:"大樹隱蔽樹洞",desc:"樹洞與竹筒也是病媒蚊隱秘的自然繁殖場所，可用泥沙填塞。"},
                {id:11,x:84.2,y:79.3,r:8,name:"未加蓋的容器",desc:"下雨容易積水，孳生病媒蚊卵，應落實巡倒清刷..."},
                {id:12,x:63.7,y:50.8,r:8,name:"廢棄容器",desc:"廢棄容器未加蓋，應倒置擺放，避免積水。"},
                {id:13,x:58.2,y:60.4,r:8,name:"廢棄容器",desc:"廢棄容器建議加蓋或是倒置擺放。"},
                {id:14,x:75.5,y:65.2,r:8,name:"潮濕的紙箱",desc:"潮濕的紙箱本身不會直接孳生蚊子，但它會吸收水氣、發霉並提供陰暗環境，吸引蚊子躲藏或吸引其他蚊蟲（如蟑螂、蠹蟲）進駐。"},
                {id:15,x:17.2,y:82.4,r:12,name:"廢棄輪胎",desc:"輪胎的內部凹槽極易積水，且黑色吸熱也吸引蚊子。"}
            ]}
        ]};

        // UI States
        var playerClass = "701", playerName = "", currentLevelIndex = 0, foundHotspots = [], totalMistakes = 0, gameFinished = false, isTimerPaused = false, pauseStartTime = 0;
        var AudioSynth = { ctx:null, init: function() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }, playSound: function(f, d) { try { this.init(); var o=this.ctx.createOscillator(), g=this.ctx.createGain(); o.connect(g); g.connect(this.ctx.destination); o.frequency.value=f; g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime+d); o.start(); o.stop(this.ctx.currentTime+d); } catch(e){} }, playHit: function() { this.playSound(440, 0.1); }, playMiss: function() { this.playSound(150, 0.1); }, playLevelClear: function() { this.playSound(880, 0.5); }, playTriumph: function() { this.playSound(523, 1); } };

        function startGame() {
            playerName = document.getElementById('input-name').value.trim();
            if(!playerName) return showAlert("warning", "哎呀！", "請輸入姓名！");
            document.getElementById('screen-welcome').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            loadLevel(0); startTime = performance.now(); startTimer();
        }

        function loadLevel(idx) {
            currentLevelIndex = idx; foundHotspots = [];
            const level = gameData.levels[idx];
            document.getElementById('hud-level-num').innerText = level.levelNum;
            document.getElementById('hud-found-count').innerText = "0";
            document.getElementById('hud-total-count').innerText = level.hotspots.filter(h => !h.name.startsWith("[衛教]")).length;
            document.getElementById('game-bg-image').src = level.bgImg;
            document.getElementById('found-markers-layer').innerHTML = '';
        }

        function startTimer() {
            timerInterval = setInterval(() => { if(!gameFinished && !isTimerPaused) { elapsedTime = (performance.now() - startTime) / 1000; document.getElementById('hud-timer').innerText = formatTime(elapsedTime); } }, 33);
        }

        function formatTime(secs) { return (Math.floor(secs/60)).toString().padStart(2,'0') + ":" + (Math.floor(secs%60)).toString().padStart(2,'0') + "." + Math.floor((secs%1)*100).toString().padStart(2,'0'); }

        function handleBoardClick(e) {
            if(gameFinished || isTimerPaused) return;
            const rect = document.getElementById('game-click-layer').getBoundingClientRect();
            const clickX = ((e.clientX - rect.left) / rect.width) * 100, clickY = ((e.clientY - rect.top) / rect.height) * 100;
            for(let spot of gameData.levels[currentLevelIndex].hotspots) {
                if(Math.sqrt(Math.pow(clickX - spot.x, 2) + Math.pow(clickY - spot.y, 2)) <= spot.r) {
                    if(foundHotspots.includes(spot.id)) return;
                    handleSuccessfulHit(spot); return;
                }
            }
            handleMiss();
        }

        let currentQuizSpot = null, pendingLevelCompletion = false;
        function handleSuccessfulHit(spot) {
            foundHotspots.push(spot.id);
            const isEdu = spot.name.startsWith("[衛教]");
            if(!isEdu) {
                document.getElementById('hud-found-count').innerText = foundHotspots.filter(id => !gameData.levels[currentLevelIndex].hotspots.find(h => h.id === id).name.startsWith("[衛教]")).length;
                if(foundHotspots.filter(id => !gameData.levels[currentLevelIndex].hotspots.find(h => h.id === id).name.startsWith("[衛教]")).length >= gameData.levels[currentLevelIndex].hotspots.filter(h => !h.name.startsWith("[衛教]")).length) pendingLevelCompletion = true;
            }
            
            isTimerPaused = true; pauseStartTime = performance.now();
            document.getElementById('timer-status-indicator').classList.remove('hidden');
            
            currentQuizSpot = spot;
            document.getElementById('alert-title').innerHTML = isEdu ? "💡 衛教小貼士" : "✨ 發現孳生源！";
            document.getElementById('alert-text').innerHTML = `<strong>【${spot.name.replace("[衛教]","")}】</strong><br>${spot.desc}`;
            
            if(!isEdu) {
                document.getElementById('quiz-container').classList.remove('hidden');
                document.getElementById('alert-btn').classList.add('hidden');
            } else {
                document.getElementById('quiz-container').classList.add('hidden');
                document.getElementById('alert-btn').classList.remove('hidden');
            }
            document.getElementById('custom-alert').classList.remove('hidden'); document.getElementById('custom-alert').classList.add('flex');
            createSuccessMarker(spot.x, spot.y);
        }

        function handleQuizAnswer(isO) {
            if(isO) { startTime += 3000; showAlert("success", "🎉 答對了！", "正確觀念！系統給予減 3 秒獎勵。"); }
            else { startTime -= 10000; totalMistakes+=3; showAlert("warning", "❌ 答錯了！", "再看一次說明喔！系統加罰 10 秒。"); }
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('alert-btn').classList.remove('hidden');
        }

        function handleMiss() { totalMistakes++; startTime -= 3000; document.getElementById('hud-mistakes').innerText = totalMistakes + " 次"; AudioSynth.playMiss(); }

        function createSuccessMarker(x, y) {
            const m = document.createElement('div');
            m.className = "absolute w-10 h-10 bg-emerald-500 rounded-full flex items-center justify-center text-white text-sm shadow-md animate-splat";
            m.style.left = x + "%"; m.style.top = y + "%"; m.style.transform = 'translate(-50%,-50%)';
            m.innerHTML = '<i class="fa-solid fa-check"></i>';
            document.getElementById('found-markers-layer').appendChild(m);
        }

        function closeAlert() {
            document.getElementById('custom-alert').classList.add('hidden');
            isTimerPaused = false; startTime += (performance.now() - pauseStartTime);
            document.getElementById('timer-status-indicator').classList.add('hidden');
            if(pendingLevelCompletion) { pendingLevelCompletion = false; handleLevelComplete(); }
        }

        function handleLevelComplete() {
            AudioSynth.playLevelClear();
            if(currentLevelIndex === gameData.levels.length - 1) endGameSession();
            else showAlert("success", "🏆 關卡完成！", "前進下一關！", () => loadLevel(currentLevelIndex + 1));
        }

        function endGameSession() { gameFinished = true; showAlert("success", "🎊 全關卡通關！", "成績已記錄！"); }

        function toggleSettings() {
            const modal = document.getElementById('modal-settings');
            if(modal.classList.contains('hidden')) {
                const pwd = prompt("密碼 (預設6888)：");
                if(pwd === TEACHER_PASSWORD) { modal.classList.remove('hidden'); modal.classList.add('flex'); loadEditorLevel(); }
            } else { modal.classList.add('hidden'); modal.classList.remove('flex'); }
        }

        function loadEditorLevel() { selectedEditorLevel = parseInt(document.getElementById('editor-level-select').value); document.getElementById('editor-img-url').value = gameData.levels[selectedEditorLevel].bgImg; document.getElementById('editor-bg-preview').src = document.getElementById('editor-img-url').value; renderEditorMarkers(); }
        function updateEditorBg() { document.getElementById('editor-bg-preview').src = document.getElementById('editor-img-url').value; renderEditorMarkers(); }
        function renderEditorMarkers() { const layer = document.getElementById('editor-markers-layer'); layer.innerHTML = ''; gameData.levels[selectedEditorLevel].hotspots.forEach(spot => { const m = document.createElement('div'); m.className = "absolute w-8 h-8 bg-teal-500 rounded-full border-2 border-white cursor-move"; m.style.left = spot.x + "%"; m.style.top = spot.y + "%"; m.style.transform = 'translate(-50%,-50%)'; layer.appendChild(m); }); }
        function saveAllConfigs() { localStorage.setItem('dengue_game_config', JSON.stringify(gameData)); toggleSettings(); if(!document.getElementById('screen-game').classList.contains('hidden')) loadLevel(currentLevelIndex); }
        function resetToDefaultConfigs() { localStorage.removeItem('dengue_game_config'); location.reload(); }
    </script>
</body>
</html>
